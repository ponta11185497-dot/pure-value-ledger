name: Weekly Data Update

on:
  schedule:
    # 毎週月・木 0:00 UTC = 月・木 9:00 JST(週2回)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ステップ1: 決定的収集(AI不使用)。
      # sources.json の collectMethod が parser/structured/rss/api のものはここで処理し、
      # products.json / collection_log.json を更新する。ai-webfetch 指定のものと、RSSで
      # 見つかった記事リンクは ai_queue.json にキューイングしてステップ2に渡す。
      - name: Run deterministic collectors
        run: node scripts/collect.js

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools WebSearch,WebFetch,Read,Write,Edit --disallowedTools Agent,ScheduleWakeup --max-turns 180'
          prompt: |
            あなたはこのリポジトリの products.json / collection_log.json / sources.json を
            更新するエージェントです。以下の手順に厳密に従ってください。

            ## 絶対に守ること(最重要)
            1. **あなたの一般知識から商品名・価格・日時を創作することは絶対に禁止**です。
               WebFetch/WebSearchで実際に取得したページに書かれている内容のみを使用してください。
               確認できない項目は値を入れず、該当フィールドの value を null のままにしてください
               (「未取得」として扱われます。推測で埋めないこと)。
            2. 成約価格(recentSoldPrice)・買取価格(buybackPrice)・出品価格(purchasePrice)・
               予想売却価格(estimatedResalePrice)は明確に別のフィールドです。取得元のページが
               どの種類の価格を示しているか必ず確認し、対応するフィールドにのみ値を入れてください。
               判別できない場合はどのフィールドにも入れないこと。
            3. 既存の products.json 内アイテムの "id" は変更しないこと(ユーザーの応募記録が
               id をキーに保存されているため)。
            4. **この実行は1回で完結させること。** サブエージェント/バックグラウンドタスクは使わず、
               同期的に全処理を終えてからこの実行内で products.json 等への書き込みを完了させること。

            ## 入力ファイル
            - `ai_queue.json`: ステップ1(決定的収集)で処理できなかったソースのキュー。
              `collectMethod: "ai-webfetch"` のエントリは `url` を直接WebFetchして、個別の
              具体的な商品(シリーズ単位・代表例での登録は禁止)を抽出してください。
              `collectMethod: "rss-leads"` のエントリは `leads[].link` の記事ページを
              WebFetchし、そこで案内されている具体的な抽選・予約商品を抽出してください。
            - `sources.json`: 既存の監視サイト一覧。各ソースは `collectMethod` と `status`
              (`active`/`candidate`/`broken`)を持つ。
            - `products.json`: 既存の商品データ(スキーマは下記)。

            ## products.json のスキーマ(items[]の各要素)
            ```
            {
              "id": "不変の一意スラッグ",
              "name": "正式商品名", "model": "型番", "jan": "JANコード",
              "images": ["画像URL", ...],
              "definitivePrice": {"value": 数値またはnull, "source": {"siteName","url","fetchedAt"} または null},
              "purchasePrice": {...}, "buybackPrice": {...}, "recentSoldPrice": {...},
              "estimatedResalePrice": {...}, "platformFee": {...}, "shippingFee": {...},
              "estimatedNetProfit": {...}, "profitMarginPct": {...},
              "anaMiles": {...},
              // ↑ estimatedNetProfit/profitMarginPct/anaMiles は、この後のステップで
              //   computeFinancials.js が purchasePrice 等から自動計算します。
              //   あなたはこれら3項目を書き込まず null のままにしてください(二重計算防止)。
              "reservationStart": {...}, "applicationDeadline": {...}, "winnerAnnounceDate": {...},
              "paymentDate": {...}, "shipDate": {...},
              "purchasableQty": {...}, "visaPayment": {"value": true/false/null, "source": {...}},
              "homeDelivery": {"value": true/false/null, "source": {...}},
              "officialUrl": "文字列",
              "status": "本日応募可能|本日締切|予約受付中|予約開始予定|再販|受付終了|unknown",
              "priceHistory": [{"date","field","value","source"}],  // 既存履歴に追記、上書き削除しない
              "firstSeenAt": "ISO日時", "lastSeenAt": "ISO日時(今回確認したら更新)"
            }
            ```
            全ての value付きフィールドの `source` には `{siteName, url, fetchedAt}` を必ず入れること
            (fetchedAt は今回の実行日時)。値を更新した場合は priceHistory に追記すること。

            ## やること(同期的に、この1回の実行内で完結させる)
            1. **最優先: `ai_queue.json` に積まれている全エントリ(通常39件前後)を、必ず
               少なくとも1回は実際にWebFetch/WebSearchすること。** 1件あたりの深追いよりも
               全件を一周することを優先してください(応募可能な商品を取りこぼさないことが
               このシステムの最優先事項です)。目安として、ソース数が多い場合は1ソースあたりの
               追加調査(個別記事への深掘り)は多くても2〜3件までに留め、それ以上必要な場合は
               今回は見出し情報だけで判断するか、未確認のまま次回に回してください。
               実在するページの内容から具体的な商品(型番・JAN等の単位で個体識別できるもの)を
               抽出し、products.json に反映する。既存商品と同一と判断できる場合は新規作成せず
               既存アイテムを更新すること。
               - まとめ記事・一覧ページ(例: トレチュー、ガンプラ予約速報等)で見出しだけ
                 価格や当選発表日が分からない場合、時間に余裕があれば個別記事/個別商品ページを
                 2〜3件WebFetchして確認してから登録する。時間がなければ `empty_confirmed` として
                 記録し、次回以降の深掘り対象にする(全件一周を優先するため)。
               - `type: "x"`(Xアカウント)のソースは `https://x.com/...` を直接WebFetchしても
                 ブロックされるため、代わりにWebSearchで `@アカウント名` や該当ブランド名+
                 「抽選」「予約」等のキーワードで検索し、ヒットした一次情報(公式サイト・
                 公式リリース)のページをWebFetchして内容を確認すること。WebSearchでも
                 何も見つからなければ `fetch_failed` として理由を記録してよい。
               - HTTP 403やタイムアウトで取得できないサイトは、User-Agent偽装や認証回避など
                 利用規約に反する手段で突破しようとしないこと。失敗として記録してよい。
               - `ai_queue.json` の件数が多く全件処理に時間がかかりすぎると判断した場合は、
                 深掘りを一切せず見出し情報の確認のみで次のソースに進み、必ず最後のソースまで
                 到達してから products.json / collection_log.json への書き込みに移ること。
            2. `sources.json` に未登録の新しい監視サイト候補をWebSearchで探し、見つかった場合は
               `sources.json` に `status: "candidate"`, `collectMethod: "ai-webfetch"` として追加する
               (まだ `active` にはしない。候補が多すぎる場合は特に有望なもの数件まででよい)。
            3. `collection_log.json` の対応エントリ(ai-webfetch / rss-leads 扱いだったソース)を、
               実際に処理した結果(fetchedCount, newItemCount, failedCount, resultType, errorDetail)
               で上書き更新する。取得失敗したソースは必ず `resultType: "fetch_failed"` と
               `errorDetail` に理由を記録すること。0件だが取得自体は成功した場合は
               `resultType: "empty_confirmed"` とすること。
            4. 各商品の `status` を、応募締切・予約開始等の日時フィールドと本日日付(UTC基準)から
               判定して更新する。
            4b. **買取価格(buybackPrice)・成約価格(recentSoldPrice)・予想売却価格
               (estimatedResalePrice)の調査は、このワークフローでは行わないこと。**
               それらは別のワークフロー `market-research.yml` が専用のターン予算で調査する
               役割分担になっている(新商品発見と相場調査でターン不足が相互に影響しないため)。
               あなたはここでは `purchasePrice`(仕入れ可能価格・定価)と各種日時・購入条件の
               取得に専念すること。
            5. 変更後、products.json / sources.json / collection_log.json がすべて有効なJSONで
               あることを自分で確認する。(git操作は後段のステップが自動で行うので、あなたは
               ファイルの編集のみ行えばよい。commitやpushは行わなくてよい/その権限もない。)

            `プレ値台帳.html`、`data.json`、ワークフローファイル自体、`scripts/` 配下の
            決定的収集コードは変更しないこと。対象は products.json / sources.json /
            collection_log.json のみです。

      # ステップ3: 売却利益・利益率・ANAマイルの自動計算(AIには計算させない、決定的スクリプト)。
      - name: Compute profit / margin / ANA miles
        run: node scripts/computeFinancials.js

      - name: Configure git and push
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # claude-code-action がgitの認証情報を独自トークンに書き換えているため、
          # push前に標準のGITHUB_TOKENへ明示的に戻す。
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if [ -n "$(git status --porcelain products.json sources.json collection_log.json)" ]; then
            git add products.json sources.json collection_log.json
            git commit -m "Weekly data update $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to products.json/sources.json/collection_log.json"
          fi
